# raenko.pro — статический сайт за nginx на Selectel.
# Эквивалент vercel.json: те же заголовки безопасности и политика кэша.
# Корень сайта — симлинк /var/www/raenko/current -> releases/<sha> (атомарное переключение).

server {
    listen 80;
    listen [::]:80;
    server_name raenko.pro www.raenko.pro;

    # Проверка домена Let's Encrypt (HTTP-01)
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / { return 301 https://raenko.pro$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.raenko.pro;

    ssl_certificate     /etc/letsencrypt/live/raenko.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raenko.pro/privkey.pem;

    return 301 https://raenko.pro$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name raenko.pro;

    ssl_certificate     /etc/letsencrypt/live/raenko.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raenko.pro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /var/www/raenko/current;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Сжатие. woff2 и webp уже сжаты, их не трогаем.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Заголовки безопасности (1:1 с vercel.json) + HSTS.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # HTML, CSS, JS без версии в имени: браузер всегда проверяет актуальность (ETag).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Файлы с версией в имени (-a1, -a2): кэш на год, неизменяемые.
    location ~ ^/assets/(hero-a[0-9]+\.webp|hero-depth-a[0-9]+\.webp|og-a[0-9]+\.jpg|fonts/[^/]+-a[0-9]+\.woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }

    # Служебные файлы не отдаём наружу.
    location ~ /\.(?!well-known) { return 404; }
    location ~ ^/(tools|deploy|docs|\.github)/ { return 404; }
    location ~ ^/(vercel\.json|README\.md)$ { return 404; }
}
